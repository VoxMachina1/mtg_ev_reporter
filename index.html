<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTG EV Report</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg:         #111318;
      --surface:    #1c1f26;
      --border:     #2e3240;
      --text:       #d4d8e8;
      --text-muted: #6b7280;
      --header-bg:  #23262f;
      --hover-bg:   #21242d;
      --accent:     #5b8dee;
      --accent-dim: #1e2d4a;
      --green:      #4ade80;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.25rem;
      color: var(--text);
      background: var(--bg);
    }

    h1 { font-size: 1.5rem; margin: 0 0 0.2rem; color: #fff; }
    .meta { color: var(--text-muted); font-size: 0.82rem; margin-bottom: 1.5rem; }

    /* ── Controls ── */
    .controls { display: flex; flex-wrap: wrap; gap: 1.1rem; align-items: flex-end; margin-bottom: 1.1rem; }
    .control-group { display: flex; flex-direction: column; gap: 0.3rem; }
    label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

    input[type="text"], select {
      padding: 0.4rem 0.65rem;
      font-size: 0.88rem;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
    }
    input[type="text"]:focus, select:focus { border-color: var(--accent); }
    input[type="text"] { min-width: 220px; }
    select { min-width: 180px; }

    button {
      padding: 0.4rem 0.9rem;
      font-size: 0.82rem;
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      align-self: flex-end;
    }
    button:hover { background: var(--hover-bg); color: var(--text); }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 1.1rem; }
    .tab {
      padding: 0.55rem 1.25rem;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      background: none;
      margin-bottom: -1px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); background: var(--surface); border-color: var(--border); }

    /* ── Count ── */
    .count { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.65rem; min-height: 1rem; }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    thead th {
      text-align: left;
      padding: 0.55rem 0.75rem;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      white-space: nowrap;
    }
    tbody td { padding: 0.45rem 0.75rem; border-bottom: 1px solid var(--border); color: var(--text); }
    tbody tr:hover td { background: var(--hover-bg); }
    .ev-val { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--green); }
    .set-code { font-family: monospace; font-size: 0.8rem; color: var(--text-muted); }
    .top5 { font-size: 0.78rem; color: var(--text-muted); max-width: 340px; }

    /* ── Sortable headers ── */
    thead th.sortable { cursor: pointer; user-select: none; }
    thead th.sortable:hover { color: var(--text); }
    thead th.sort-asc::after  { content: " ↑"; color: var(--accent); }
    thead th.sort-desc::after { content: " ↓"; color: var(--accent); }

    /* ── Status ── */
    #status { padding: 1.5rem 0; color: var(--text-muted); font-style: italic; }

    /* ── Panel visibility ── */
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>
  <h1>MTG EV Report</h1>
  <p class="meta" id="meta"></p>

  <!-- Snapshot selector (shared) -->
  <div class="controls" style="margin-bottom: 1.4rem;">
    <div class="control-group">
      <label for="snapshot-select">Snapshot</label>
      <select id="snapshot-select" onchange="loadSnapshot(this.value)"></select>
    </div>
  </div>

  <p id="status">Loading...</p>

  <!-- Tabs -->
  <div class="tabs" id="tabs" hidden>
    <button class="tab active" onclick="switchTab('boosters', this)">Boosters</button>
    <button class="tab" onclick="switchTab('precons', this)">Precon Decks</button>
  </div>

  <!-- ── Boosters panel ── -->
  <div class="panel active" id="panel-boosters">
    <div class="controls">
      <div class="control-group">
        <label for="b-filter-set">Set Name</label>
        <input type="text" id="b-filter-set" placeholder="Search sets…" oninput="applyBoosterFilters()">
      </div>
      <div class="control-group">
        <label for="b-filter-pack">Pack Type</label>
        <select id="b-filter-pack" onchange="applyBoosterFilters()">
          <option value="">All pack types</option>
        </select>
      </div>
      <button onclick="clearBoosterFilters()">Clear filters</button>
    </div>
    <p class="count" id="b-count"></p>
    <table id="b-table" hidden>
      <thead>
        <tr>
          <th class="sortable" onclick="setBoosterSort('Set Name')">Set Name</th>
          <th class="sortable" onclick="setBoosterSort('Set Code')">Set Code</th>
          <th class="sortable" onclick="setBoosterSort('Pack Type')">Pack Type</th>
          <th class="sortable" onclick="setBoosterSort('Expected Value')">Expected Value</th>
          <th class="sortable" onclick="setBoosterSort('Confidence')">Confidence</th>
        </tr>
      </thead>
      <tbody id="b-body"></tbody>
    </table>
  </div>

  <!-- ── Precons panel ── -->
  <div class="panel" id="panel-precons">
    <div class="controls">
      <div class="control-group">
        <label for="p-filter-name">Deck Name</label>
        <input type="text" id="p-filter-name" placeholder="Search decks…" oninput="applyPreconFilters()">
      </div>
      <div class="control-group">
        <label for="p-filter-cat">Category</label>
        <select id="p-filter-cat" onchange="applyPreconFilters()">
          <option value="">All categories</option>
          <option value="Commander">Commander</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <button onclick="clearPreconFilters()">Clear filters</button>
    </div>
    <p class="count" id="p-count"></p>
    <p id="p-status"></p>
    <table id="p-table" hidden>
      <thead>
        <tr>
          <th class="sortable" onclick="setPreconSort('Deck Name')">Deck Name</th>
          <th class="sortable" onclick="setPreconSort('Category')">Category</th>
          <th class="sortable" onclick="setPreconSort('Set Code')">Set Code</th>
          <th class="sortable" onclick="setPreconSort('Release Date')">Release Date</th>
          <th class="sortable" onclick="setPreconSort('Total Value')">Total Value</th>
          <th>Top 5 Cards</th>
        </tr>
      </thead>
      <tbody id="p-body"></tbody>
    </table>
  </div>

  <script>
    // ── Shared state ──
    let boosterRows = [];
    let preconRows  = [];
    let currentSnapshot = null;

    // ── Sort state ──
    const B_NUMERIC = new Set(["Expected Value", "Confidence"]);
    const P_NUMERIC = new Set(["Total Value"]);
    let bSort = { col: null, dir: 1 };
    let pSort = { col: null, dir: 1 };

    function _sortRows(rows, col, dir, numericCols) {
      if (!col) return rows;
      return [...rows].sort((a, b) => {
        let av = a[col] || "", bv = b[col] || "";
        if (numericCols.has(col)) {
          return (parseFloat(av) - parseFloat(bv)) * dir;
        }
        return av.localeCompare(bv) * dir;
      });
    }

    function _updateSortHeaders(tableId, sortState) {
      document.querySelectorAll(`#${tableId} thead th`).forEach(th => {
        th.classList.remove("sort-asc", "sort-desc");
        if (th.textContent.trim() === sortState.col) {
          th.classList.add(sortState.dir === 1 ? "sort-asc" : "sort-desc");
        }
      });
    }

    function setBoosterSort(col) {
      bSort = bSort.col === col ? { col, dir: bSort.dir * -1 } : { col, dir: 1 };
      _updateSortHeaders("b-table", bSort);
      applyBoosterFilters();
    }

    function setPreconSort(col) {
      pSort = pSort.col === col ? { col, dir: pSort.dir * -1 } : { col, dir: 1 };
      _updateSortHeaders("p-table", pSort);
      applyPreconFilters();
    }

    const status      = document.getElementById("status");
    const tabs        = document.getElementById("tabs");
    const snapshotSel = document.getElementById("snapshot-select");

    // ── CSV parser ──
    function parseCSV(text) {
      const lines = text.trim().split("\n");
      if (lines.length < 2) return [];
      const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ""));
      return lines.slice(1).map(line => {
        const vals = line.split(",");
        return Object.fromEntries(headers.map((h, i) => [h, (vals[i] || "").trim().replace(/^"|"$/g, "")]));
      });
    }

    // ── Tab switching ──
    function switchTab(name, btn) {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(`panel-${name}`).classList.add("active");
    }

    // ── Booster helpers ──
    function populatePackFilter(rows) {
      const types = [...new Set(rows.map(r => r["Pack Type"]))].sort();
      const sel = document.getElementById("b-filter-pack");
      sel.innerHTML = '<option value="">All pack types</option>';
      types.forEach(t => {
        const o = document.createElement("option");
        o.value = o.textContent = t;
        sel.appendChild(o);
      });
    }

    function applyBoosterFilters() {
      const setQ  = document.getElementById("b-filter-set").value.trim().toLowerCase();
      const packQ = document.getElementById("b-filter-pack").value;
      const filtered = boosterRows.filter(r =>
        (!setQ  || r["Set Name"].toLowerCase().includes(setQ)) &&
        (!packQ || r["Pack Type"] === packQ)
      );
      renderBoosterRows(_sortRows(filtered, bSort.col, bSort.dir, B_NUMERIC));
      document.getElementById("b-count").textContent =
        `Showing ${filtered.length} of ${boosterRows.length} results`;
    }

    function renderBoosterRows(rows) {
      const frag = document.createDocumentFragment();
      for (const r of rows) {
        const ev = parseFloat(r["Expected Value"]);
        const tr = document.createElement("tr");
        tr.innerHTML =
          `<td>${r["Set Name"]}</td>` +
          `<td class="set-code">${r["Set Code"] || ""}</td>` +
          `<td>${r["Pack Type"]}</td>` +
          `<td class="ev-val">$${isNaN(ev) ? "—" : ev.toFixed(2)}</td>` +
          `<td class="set-code">${r["Confidence"] || ""}</td>`;
        frag.appendChild(tr);
      }
      const tbody = document.getElementById("b-body");
      tbody.innerHTML = "";
      tbody.appendChild(frag);
    }

    function clearBoosterFilters() {
      document.getElementById("b-filter-set").value = "";
      document.getElementById("b-filter-pack").value = "";
      applyBoosterFilters();
    }

    // ── Precon helpers ──
    function applyPreconFilters() {
      const nameQ = document.getElementById("p-filter-name").value.trim().toLowerCase();
      const catQ  = document.getElementById("p-filter-cat").value;
      const filtered = preconRows.filter(r =>
        (!nameQ || r["Deck Name"].toLowerCase().includes(nameQ)) &&
        (!catQ  || r["Category"] === catQ)
      );
      renderPreconRows(_sortRows(filtered, pSort.col, pSort.dir, P_NUMERIC));
      document.getElementById("p-count").textContent =
        `Showing ${filtered.length} of ${preconRows.length} decks`;
    }

    function renderPreconRows(rows) {
      const frag = document.createDocumentFragment();
      for (const r of rows) {
        const val = parseFloat(r["Total Value"]);
        const tr = document.createElement("tr");
        tr.innerHTML =
          `<td>${r["Deck Name"]}</td>` +
          `<td>${r["Category"] || ""}</td>` +
          `<td class="set-code">${r["Set Code"] || ""}</td>` +
          `<td class="set-code">${r["Release Date"] || ""}</td>` +
          `<td class="ev-val">$${isNaN(val) ? "—" : val.toFixed(2)}</td>` +
          `<td class="top5">${r["Top 5 Cards"] || ""}</td>`;
        frag.appendChild(tr);
      }
      const tbody = document.getElementById("p-body");
      tbody.innerHTML = "";
      tbody.appendChild(frag);
    }

    function clearPreconFilters() {
      document.getElementById("p-filter-name").value = "";
      document.getElementById("p-filter-cat").value = "";
      applyPreconFilters();
    }

    // ── Snapshot loading ──
    async function loadSnapshot(snapshot) {
      currentSnapshot = snapshot;
      boosterRows = [];
      preconRows  = [];

      // Reset booster table
      document.getElementById("b-table").hidden = true;
      document.getElementById("b-count").textContent = "";
      document.getElementById("b-body").innerHTML = "";

      // Reset precon table
      document.getElementById("p-table").hidden = true;
      document.getElementById("p-count").textContent = "";
      document.getElementById("p-body").innerHTML = "";
      document.getElementById("p-status").textContent = "";

      // Cache-bust using the snapshot timestamp so same-day rewrites are picked up
      const bust = `?t=${encodeURIComponent(snapshot.timestamp)}`;

      // Load boosters
      try {
        const res = await fetch(`data/${snapshot.ev_report}${bust}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        boosterRows = parseCSV(await res.text()).sort((a, b) =>
          a["Set Name"].localeCompare(b["Set Name"]) ||
          a["Pack Type"].localeCompare(b["Pack Type"])
        );
        populatePackFilter(boosterRows);
        applyBoosterFilters();
        document.getElementById("b-table").hidden = false;
      } catch (e) {
        document.getElementById("b-count").textContent = `Failed to load booster data: ${e.message}`;
      }

      // Load precons (optional — older snapshots may not have this)
      if (snapshot.precons) {
        try {
          const res = await fetch(`data/${snapshot.precons}${bust}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          preconRows = parseCSV(await res.text());
          applyPreconFilters();
          document.getElementById("p-table").hidden = false;
        } catch (e) {
          document.getElementById("p-status").textContent = `Failed to load precon data: ${e.message}`;
        }
      } else {
        document.getElementById("p-status").textContent = "No precon data for this snapshot.";
      }
    }

    // ── Init ──
    async function init() {
      try {
        const res = await fetch(`data/manifest.json?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const manifest = await res.json();

        const snapshots = (manifest.snapshots || []).sort((a, b) => b.date.localeCompare(a.date));
        if (!snapshots.length) {
          status.textContent = "No snapshots available yet.";
          return;
        }

        if (manifest.last_updated) {
          document.getElementById("meta").textContent =
            `Last updated: ${new Date(manifest.last_updated).toLocaleString()}`;
        }

        for (const s of snapshots) {
          const opt = document.createElement("option");
          opt.value = s.date;
          opt.textContent = s.date;
          opt._snapshot = s;
          snapshotSel.appendChild(opt);
        }

        // Store snapshots on the select for lookup
        snapshotSel._snapshots = Object.fromEntries(snapshots.map(s => [s.date, s]));
        snapshotSel.onchange = () => {
          const s = snapshotSel._snapshots[snapshotSel.value];
          if (s) loadSnapshot(s);
        };

        status.hidden = true;
        tabs.hidden = false;
        loadSnapshot(snapshots[0]);
      } catch (e) {
        status.textContent = `Failed to load manifest: ${e.message}`;
      }
    }

    init();
  </script>
</body>
</html>
