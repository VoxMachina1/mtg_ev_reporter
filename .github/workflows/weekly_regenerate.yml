name: Weekly Config Regeneration

on:
  schedule:
    - cron: '0 1 * * 0'   # 1 AM UTC every Sunday
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate config
        run: python regenerate_config.py

      - name: Commit config files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/
          git diff --cached --quiet && echo "No changes" || (
            git commit -m "Config regeneration $(date -u +%Y-%m-%d)" &&
            git push
          )

